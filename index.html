<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Calabasse Fleurs</title>
<style>
  html, body { margin: 0; height: 100%; background: #2f6b4f; overflow: hidden; touch-action: none;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var W = 360, H = 640;
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var scale = 1, dpr = window.devicePixelRatio || 1;

  function resize() {
    var s = Math.min(window.innerWidth / W, window.innerHeight / H);
    scale = s;
    canvas.style.width = (W * s) + "px";
    canvas.style.height = (H * s) + "px";
    canvas.width = Math.round(W * s * dpr);
    canvas.height = Math.round(H * s * dpr);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- Données ----------
  var FL = [
    { e: "🌹", price: 8 },
    { e: "🌷", price: 10 },
    { e: "🌻", price: 14 },
    { e: "🪻", price: 18 }
  ];
  var CUSTOMERS = ["👩", "👨", "👵", "👴", "🧑", "👩‍🦰", "🧔", "👱‍♀️"];

  var COUNTER = { x: 90, y: 340, w: 180, h: 28 };
  var SERVE = { x: 180, y: 312, r: 52 };
  var CASH = { x: 308, y: 354, r: 34 };
  var FRONT = { x: 180, y: 398 };
  var DOOR = { x: 180, y: 650 };

  var beds = [
    { x: 90,  y: 120, t: 0, unlocked: true,  stock: 2, timer: 0 },
    { x: 270, y: 120, t: 1, unlocked: true,  stock: 2, timer: 0 },
    { x: 90,  y: 225, t: 2, unlocked: false, stock: 0, timer: 0, cost: 60,  paid: 0, acc: 0 },
    { x: 270, y: 225, t: 3, unlocked: false, stock: 0, timer: 0, cost: 120, paid: 0, acc: 0 }
  ];

  var S = {
    coins: 0, pile: 0,
    capLevel: 0, speedLevel: 0,
    served: 0
  };
  function cap() { return 3 + 2 * S.capLevel; }
  function speedMul() { return 1 + 0.2 * S.speedLevel; }

  var pads = [
    { id: "cap",   x: 70,  y: 575, label: "Grand sac 🎒", acc: 0, paid: 0 },
    { id: "speed", x: 290, y: 575, label: "Bottines 👟",  acc: 0, paid: 0 }
  ];
  function padCost(p) {
    return p.id === "cap" ? 40 * (S.capLevel + 1) : 50 * (S.speedLevel + 1);
  }
  function padVisible(p) {
    return p.id === "cap" ? S.capLevel < 3 : S.speedLevel < 3;
  }

  var player = { x: 180, y: 290, vx: 0, vy: 0, carry: [] };
  var customers = [];
  var floaters = [];
  var spawnTimer = 1.5;
  var hint = 9;           // secondes d'affichage de l'aide
  var pickTimer = 0, serveTimer = 0;
  var time = 0;

  // ---------- Contrôle (joystick tactile) ----------
  var joy = { on: false, ox: 0, oy: 0, x: 0, y: 0, id: null };
  var keys = {};
  function toLogical(ev) {
    var r = canvas.getBoundingClientRect();
    return { x: (ev.clientX - r.left) / scale, y: (ev.clientY - r.top) / scale };
  }
  canvas.addEventListener("pointerdown", function (ev) {
    var p = toLogical(ev);
    joy.on = true; joy.id = ev.pointerId; joy.ox = joy.x = p.x; joy.oy = joy.y = p.y;
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    ev.preventDefault();
  });
  canvas.addEventListener("pointermove", function (ev) {
    if (!joy.on || ev.pointerId !== joy.id) return;
    var p = toLogical(ev); joy.x = p.x; joy.y = p.y;
    ev.preventDefault();
  });
  function endJoy(ev) { if (ev.pointerId === joy.id) joy.on = false; }
  canvas.addEventListener("pointerup", endJoy);
  canvas.addEventListener("pointercancel", endJoy);
  window.addEventListener("keydown", function (e) { keys[e.key] = true; });
  window.addEventListener("keyup", function (e) { keys[e.key] = false; });

  function inputVector() {
    var dx = 0, dy = 0;
    if (joy.on) {
      dx = joy.x - joy.ox; dy = joy.y - joy.oy;
      var d = Math.hypot(dx, dy), max = 38;
      if (d > 6) { var k = Math.min(d, max) / max; dx = dx / d * k; dy = dy / d * k; } else { dx = dy = 0; }
    }
    if (keys.ArrowLeft || keys.a || keys.q) dx -= 1;
    if (keys.ArrowRight || keys.d) dx += 1;
    if (keys.ArrowUp || keys.w || keys.z) dy -= 1;
    if (keys.ArrowDown || keys.s) dy += 1;
    var m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    return { x: dx, y: dy };
  }

  // ---------- Utilitaires ----------
  function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
  function floater(text, x, y, color) { floaters.push({ text: text, x: x, y: y, life: 1, color: color || "#fff" }); }
  function blocked(x, y) {
    return x > COUNTER.x - 14 && x < COUNTER.x + COUNTER.w + 14 && y > COUNTER.y - 12 && y < COUNTER.y + COUNTER.h + 12;
  }
  function activeTypes() {
    var a = [];
    beds.forEach(function (b) { if (b.unlocked) a.push(b.t); });
    return a;
  }

  // ---------- Mise à jour ----------
  function update(dt) {
    time += dt;
    if (hint > 0) hint -= dt * (S.served > 0 ? 3 : 1);

    // déplacement
    var v = inputVector();
    var sp = 120 * speedMul();
    var nx = player.x + v.x * sp * dt, ny = player.y + v.y * sp * dt;
    nx = Math.max(22, Math.min(W - 22, nx));
    ny = Math.max(70, Math.min(H - 40, ny));
    if (!blocked(nx, player.y)) player.x = nx;
    if (!blocked(player.x, ny)) player.y = ny;

    // production des parterres
    beds.forEach(function (b) {
      if (!b.unlocked) return;
      if (b.stock < 6) {
        b.timer += dt;
        if (b.timer >= 1.3) { b.timer = 0; b.stock++; }
      }
    });

    // ramassage automatique
    pickTimer -= dt;
    if (pickTimer <= 0 && player.carry.length < cap()) {
      for (var i = 0; i < beds.length; i++) {
        var b = beds[i];
        if (b.unlocked && b.stock > 0 && dist(player.x, player.y, b.x, b.y) < 62) {
          b.stock--; player.carry.push(b.t); pickTimer = 0.18; break;
        }
      }
    }

    // clients
    spawnTimer -= dt;
    var waiting = customers.filter(function (c) { return c.state !== "leave"; });
    if (spawnTimer <= 0 && waiting.length < 4) {
      var types = activeTypes();
      customers.push({
        x: DOOR.x + (Math.random() * 40 - 20), y: DOOR.y, tx: FRONT.x, ty: FRONT.y,
        want: types[Math.floor(Math.random() * types.length)],
        emoji: CUSTOMERS[Math.floor(Math.random() * CUSTOMERS.length)],
        state: "walk", patience: 30, mood: ""
      });
      spawnTimer = 3.5 + Math.random() * 2.5;
    }
    // positions dans la file
    var q = customers.filter(function (c) { return c.state !== "leave"; });
    q.forEach(function (c, idx) { c.tx = FRONT.x; c.ty = FRONT.y + idx * 58; });
    customers.forEach(function (c) {
      if (c.state === "leave") { c.tx = DOOR.x; c.ty = DOOR.y + 20; }
      var d = dist(c.x, c.y, c.tx, c.ty);
      if (d > 2) { var s = 95 * dt; c.x += (c.tx - c.x) / d * Math.min(s, d); c.y += (c.ty - c.y) / d * Math.min(s, d); }
    });
    customers = customers.filter(function (c) { return !(c.state === "leave" && c.y > H + 10); });

    // service du premier client
    var front = q[0];
    if (front) {
      var atFront = dist(front.x, front.y, FRONT.x, FRONT.y) < 6;
      if (atFront) {
        front.patience -= dt;
        if (front.patience <= 0) { front.state = "leave"; front.mood = "😠"; floater("😠", front.x, front.y - 30); }
        serveTimer -= dt;
        if (serveTimer <= 0 && dist(player.x, player.y, SERVE.x, SERVE.y) < SERVE.r) {
          var k = player.carry.indexOf(front.want);
          if (k >= 0) {
            player.carry.splice(k, 1);
            var price = FL[front.want].price;
            S.pile += price; S.served++;
            front.state = "leave"; front.mood = "😍";
            floater("+" + price, CASH.x, CASH.y - 20, "#ffe27a");
            floater("😍", front.x, front.y - 30);
            serveTimer = 0.3;
          }
        }
      }
    }

    // récupérer l'argent
    if (S.pile > 0 && dist(player.x, player.y, CASH.x, CASH.y) < CASH.r + 10) {
      S.coins += S.pile; floater("🪙 +" + S.pile, player.x, player.y - 40, "#ffe27a"); S.pile = 0;
    }

    // zones d'achat
    beds.forEach(function (b) {
      if (!b.unlocked && dist(player.x, player.y, b.x, b.y) < 48) payTo(b, b.cost, dt, function () { b.unlocked = true; b.stock = 1; floater("Nouvelle fleur !", b.x, b.y - 20, "#fff"); });
    });
    pads.forEach(function (p) {
      if (!padVisible(p)) return;
      if (dist(player.x, player.y, p.x, p.y) < 38) payTo(p, padCost(p), dt, function () {
        if (p.id === "cap") S.capLevel++; else S.speedLevel++;
        p.paid = 0; p.acc = 0;
        floater("Amélioré !", p.x, p.y - 30, "#fff");
      });
    });

    // textes flottants
    floaters.forEach(function (f) { f.life -= dt * 0.9; f.y -= 28 * dt; });
    floaters = floaters.filter(function (f) { return f.life > 0; });
  }

  function payTo(obj, cost, dt, done) {
    if (S.coins <= 0) return;
    obj.acc = (obj.acc || 0) + 70 * dt;
    var n = Math.floor(obj.acc);
    if (n < 1) return;
    obj.acc -= n;
    n = Math.min(n, S.coins, cost - obj.paid);
    S.coins -= n; obj.paid += n;
    if (obj.paid >= cost) done();
  }

  // ---------- Dessin ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function emoji(t, x, y, size) {
    ctx.font = size + "px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#000";
    ctx.fillText(t, x, y);
  }
  function label(t, x, y, size, color, stroke) {
    ctx.font = "800 " + size + "px -apple-system,'Segoe UI',Roboto,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (stroke) { ctx.lineWidth = 4; ctx.strokeStyle = stroke; ctx.strokeText(t, x, y); }
    ctx.fillStyle = color; ctx.fillText(t, x, y);
  }
  function shadow(x, y, rx) {
    ctx.fillStyle = "rgba(0,0,0,.10)";
    ctx.beginPath(); ctx.ellipse(x, y, rx, rx * 0.45, 0, 0, Math.PI * 2); ctx.fill();
  }

  function draw() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);

    // sol
    ctx.fillStyle = "#cfe9c9"; ctx.fillRect(0, 0, W, H);
    for (var gy = 0; gy < H; gy += 40) for (var gx = 0; gx < W; gx += 40) {
      if (((gx + gy) / 40) % 2 === 0) { ctx.fillStyle = "#c2e2bb"; ctx.fillRect(gx, gy, 40, 40); }
    }
    // mur du haut + enseigne
    ctx.fillStyle = "#2f8f6b"; ctx.fillRect(0, 0, W, 52);
    ctx.fillStyle = "#237a59"; ctx.fillRect(0, 48, W, 6);
    rr(80, 8, 200, 34, 10); ctx.fillStyle = "#fff6e6"; ctx.fill();
    label("🌸 Calabasse Fleurs", 180, 26, 17, "#a2395a");

    // tapis d'entrée
    rr(140, 600, 80, 40, 8); ctx.fillStyle = "#d96a85"; ctx.fill();

    // parterres
    beds.forEach(function (b) {
      shadow(b.x, b.y + 38, 54);
      rr(b.x - 52, b.y - 38, 104, 76, 16);
      ctx.fillStyle = b.unlocked ? "#8a5a3c" : "#7d8a82"; ctx.fill();
      rr(b.x - 44, b.y - 30, 88, 60, 12);
      ctx.fillStyle = b.unlocked ? "#5e3b27" : "#97a49c"; ctx.fill();
      if (b.unlocked) {
        for (var i = 0; i < 6; i++) {
          var fx = b.x - 30 + (i % 3) * 30, fy = b.y - 14 + Math.floor(i / 3) * 28;
          if (i < b.stock) emoji(FL[b.t].e, fx, fy, 26);
          else { ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.beginPath(); ctx.arc(fx, fy, 5, 0, 7); ctx.fill(); }
        }
      } else {
        emoji(FL[b.t].e, b.x, b.y - 14, 28);
        var left = b.cost - b.paid;
        label("🪙 " + left, b.x, b.y + 16, 17, "#fff", "#4a5a52");
      }
    });

    // comptoir
    shadow(COUNTER.x + COUNTER.w / 2, COUNTER.y + COUNTER.h + 8, 96);
    rr(COUNTER.x, COUNTER.y, COUNTER.w, COUNTER.h, 10); ctx.fillStyle = "#c98a4b"; ctx.fill();
    rr(COUNTER.x, COUNTER.y, COUNTER.w, 10, 8); ctx.fillStyle = "#e3a964"; ctx.fill();
    emoji("💐", COUNTER.x + 30, COUNTER.y + 6, 20);
    emoji("🧾", COUNTER.x + COUNTER.w - 30, COUNTER.y + 6, 18);
    // zone de service
    ctx.strokeStyle = "rgba(224,87,122,.55)"; ctx.lineWidth = 3; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.arc(SERVE.x, SERVE.y, 34, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    label("SERVIR", SERVE.x, SERVE.y - 44, 11, "#a2395a");

    // caisse (pile d'argent)
    rr(CASH.x - 28, CASH.y - 22, 56, 44, 12); ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fill();
    ctx.strokeStyle = "#e0a93a"; ctx.lineWidth = 3; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
    if (S.pile > 0) {
      var stack = Math.min(5, Math.ceil(S.pile / 10));
      for (var s = 0; s < stack; s++) emoji("💵", CASH.x, CASH.y + 8 - s * 6, 24);
      label(String(S.pile), CASH.x, CASH.y + 30, 14, "#fff", "#7a5b12");
    } else {
      label("💰", CASH.x, CASH.y, 22, "#fff");
    }

    // zones d'amélioration
    pads.forEach(function (p) {
      if (!padVisible(p)) return;
      var cost = padCost(p);
      shadow(p.x, p.y + 26, 32);
      rr(p.x - 40, p.y - 30, 80, 60, 14); ctx.fillStyle = "rgba(255,226,122,.85)"; ctx.fill();
      ctx.strokeStyle = "#e0a93a"; ctx.lineWidth = 3; ctx.stroke();
      // progression
      var pr = p.paid / cost;
      if (pr > 0) { rr(p.x - 40, p.y + 22, 80 * pr, 8, 4); ctx.fillStyle = "#4f9d69"; ctx.fill(); }
      label(p.label, p.x, p.y - 12, 12, "#5a3a10");
      label("🪙 " + (cost - p.paid), p.x, p.y + 8, 16, "#5a3a10");
    });

    // clients (du fond vers l'avant)
    customers.slice().sort(function (a, b) { return a.y - b.y; }).forEach(function (c) {
      shadow(c.x, c.y + 16, 16);
      emoji(c.emoji, c.x, c.y, 34);
      if (c.state !== "leave") {
        // bulle de commande
        rr(c.x - 20, c.y - 52, 40, 30, 12); ctx.fillStyle = "#fff"; ctx.fill();
        ctx.beginPath(); ctx.moveTo(c.x - 5, c.y - 23); ctx.lineTo(c.x, c.y - 17); ctx.lineTo(c.x + 5, c.y - 23); ctx.fill();
        emoji(FL[c.want].e, c.x, c.y - 37, 22);
        // patience du premier client
        if (dist(c.x, c.y, FRONT.x, FRONT.y) < 6) {
          var pr2 = Math.max(0, c.patience / 30);
          rr(c.x - 18, c.y + 22, 36, 6, 3); ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fill();
          rr(c.x - 18, c.y + 22, 36 * pr2, 6, 3); ctx.fillStyle = pr2 > .5 ? "#4f9d69" : pr2 > .25 ? "#f2b134" : "#e0577a"; ctx.fill();
        }
      } else if (c.mood) {
        emoji(c.mood, c.x + 18, c.y - 18, 18);
      }
    });

    // joueur
    shadow(player.x, player.y + 18, 18);
    emoji("🧑‍🌾", player.x, player.y, 40);
    player.carry.forEach(function (t, i) {
      emoji(FL[t].e, player.x + ((i % 2) ? 6 : -6), player.y - 30 - i * 13, 22);
    });
    if (player.carry.length >= cap()) label("MAX", player.x, player.y - 34 - player.carry.length * 13, 12, "#fff", "#c0394f");

    // textes flottants
    floaters.forEach(function (f) {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.5));
      label(f.text, f.x, f.y, 18, f.color, "rgba(0,0,0,.45)");
      ctx.globalAlpha = 1;
    });

    // HUD
    rr(10, 58, 110, 34, 17); ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.fill();
    label("🪙 " + S.coins, 65, 75, 18, "#7a5b12");
    rr(W - 100, 58, 90, 34, 17); ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.fill();
    label("🎒 " + player.carry.length + "/" + cap(), W - 55, 75, 16, "#3b2a2a");

    // joystick
    if (joy.on) {
      ctx.globalAlpha = .35;
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 38, 0, 7); ctx.fill();
      ctx.fillStyle = "#e0577a"; ctx.beginPath();
      var jd = Math.hypot(joy.x - joy.ox, joy.y - joy.oy), jk = Math.min(jd, 38) / (jd || 1);
      ctx.arc(joy.ox + (joy.x - joy.ox) * jk, joy.oy + (joy.y - joy.oy) * jk, 18, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // aide
    if (hint > 0 && S.served < 2) {
      ctx.globalAlpha = Math.min(1, hint);
      rr(20, 262, 320, 50, 14); ctx.fillStyle = "rgba(47,107,79,.92)"; ctx.fill();
      label("Glisse ton doigt pour te déplacer", 180, 280, 14, "#fff");
      label("Ramasse des fleurs, puis sers les clients !", 180, 299, 13, "#d9f2e2");
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Boucle ----------
  var last = performance.now();
  function loop(t) {
    var dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
